<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #FFFBF0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background-image: url(https://cdn.shopify.com/s/files/1/0315/4984/9731/files/dreaming-placeholder.jpg?v=1782874830);
    background-size: cover;
    background-repeat: no-repeat;
  }

  .stage {
    position: fixed;
    top: 5.5vh;
    left: 50%;
    transform: translateX(-50%);
    width: 98vw;
  }

  .center-image {
    position: absolute;
    top: 42%;
    left: 49%;
    transform: translate(-50%, -50%);
    width: 55%;
    z-index: 1;
  }

.center-image img {
  width: 100%;
  height: auto;
  display: block;
}

  svg#art {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  #maskStrokes path {
    fill: none;
    stroke: #fff;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Controls panel */
  #controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 16px 18px;
    width: 260px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    font-size: 13px;
    color: #333;
  }

  #controls h3 {
    margin: 0 0 12px;
    font-size: 14px;
    font-weight: 600;
  }

  .control-row {
    margin-bottom: 12px;
  }

  .control-row label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .control-row input[type="range"] {
    width: 100%;
  }

  .control-row select {
    width: 100%;
    padding: 4px;
  }

  #replayBtn {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    background: #36131a;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }

  #replayBtn:hover {
    background: #4a1c25;
  }
</style>
</head>

           x="0" y="0" width="1426.12" height="988.89"
           mask="url(#drawMask)" preserveAspectRatio="none"/>
  </svg>
</div>

<div id="controls">
  <h3>Animation Controls</h3>

  <div class="control-row">
    <label>Speed (duration per stroke) <span id="durationVal">1.4s</span></label>
    <input type="range" id="duration" min="0.1" max="6" step="0.1" value="2.8">
  </div>

  <div class="control-row">
    <label>Stagger spacing <span id="staggerVal">0.020s</span></label>
    <input type="range" id="stagger" min="0.001" max="0.05" step="0.001" value="0.02">
  </div>

  <div class="control-row">
    <label>Choppiness</label>
    <select id="ease">
      <option value="power2.inOut" selected>Smooth (organic growth)</option>
      <option value="power1.inOut">Soft smooth</option>
      <option value="steps(8)">Slightly stepped</option>
      <option value="steps(6)">Choppy</option>
      <option value="steps(3)">Very choppy</option>
      <option value="steps(1)">Stop-motion (hard cut)</option>
    </select>
  </div>

  <div class="control-row">
    <label>Mask width (line thickness) <span id="widthVal">12px</span></label>
    <input type="range" id="strokeWidth" min="2" max="40" step="1" value="5">
  </div>

  <div class="control-row">
    <label>Order</label>
    <select id="from">
      <option value="start">Start to end</option>
      <option value="end">End to start</option>
      <option value="center">Center outward</option>
      <option value="edges" selected>Edges inward</option>
      <option value="random">Random</option>
    </select>
  </div>

  <button id="replayBtn">Replay Animation</button>
</div>

<script>
  gsap.registerPlugin(DrawSVGPlugin);

  const paths = document.querySelectorAll("#maskStrokes path");
  let currentTween = null;

  const durationInput = document.getElementById('duration');
  const staggerInput = document.getElementById('stagger');
  const easeInput = document.getElementById('ease');
  const widthInput = document.getElementById('strokeWidth');
  const fromInput = document.getElementById('from');
  const replayBtn = document.getElementById('replayBtn');

  const durationVal = document.getElementById('durationVal');
  const staggerVal = document.getElementById('staggerVal');
  const widthVal = document.getElementById('widthVal');

  function updateStrokeWidth() {
    const w = widthInput.value;
    paths.forEach(p => p.style.strokeWidth = w);
    widthVal.textContent = w + 'px';
  }

  function playAnimation() {
    if (currentTween) currentTween.kill();

    gsap.set(paths, { drawSVG: 0 });

    const duration = parseFloat(durationInput.value);
    const stagger = parseFloat(staggerInput.value);
    const ease = easeInput.value;
    const from = fromInput.value;

    durationVal.textContent = duration.toFixed(1) + 's';
    staggerVal.textContent = stagger.toFixed(3) + 's';

    currentTween = gsap.to(paths, {
      drawSVG: "100%",
      duration: duration,
      ease: ease,
      stagger: { each: stagger, from: from }
    });
  }

  // Live-update the displayed values while dragging, without replaying
  durationInput.addEventListener('input', () => {
    durationVal.textContent = parseFloat(durationInput.value).toFixed(1) + 's';
  });
  staggerInput.addEventListener('input', () => {
    staggerVal.textContent = parseFloat(staggerInput.value).toFixed(3) + 's';
  });
  widthInput.addEventListener('input', updateStrokeWidth);

  replayBtn.addEventListener('click', playAnimation);

  // Initial setup
  updateStrokeWidth();
  playAnimation();
</script>

</body>
</html>
